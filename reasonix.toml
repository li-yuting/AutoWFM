[permissions]
allow = ["Bash=Get-ChildItem -Recurse -Include *.py | Select-String -Pattern \"log\\.|logging\\.\" | Select-Object -First 200", "Bash=Get-ChildItem logs -ErrorAction SilentlyContinue | Select-Object Name,Length,LastWriteTime", "Bash=$bytes = [System.IO.File]::ReadAllBytes(\"logs\\autowfm.log\"); $len = [Math]::Min(200, $bytes.Length); $sample = [System.Text.Encoding]::UTF8.GetString($bytes, 0, $len); Write-Output \"=== UTF8 decode: ===\"; Write-Output $sample", "Bash=Get-ChildItem tests\\test_*.py | ForEach-Object { Write-Output \"=== $($_.Name) ===\"; .\\.venv\\Scripts\\python.exe $_.FullName }"]
