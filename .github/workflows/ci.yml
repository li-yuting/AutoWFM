name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pystray/playwright 在无头 Linux 装可能失败;CI 只验纯逻辑测试,
          # requirements.txt 装失败则退化为装核心依赖(测试 mock 掉 tray/playwright)
          pip install -r requirements.txt || pip install PyYAML websocket-client APScheduler requests pandas numpy statsmodels Flask openpyxl python-dotenv

      - name: Run tests
        env:
          PYTHONIOENCODING: utf-8
          # CI 环境无 .env(密钥不入库);看板认证测试兼容 token 未设场景
          AUTOWFM_DASH_TOKEN: ""
        run: |
          # 逐个运行测试(无 pytest,遵循仓库约定);smoke.py 需 WS 网络,不纳入 CI
          set -e
          failed=0
          for f in tests/test_*.py; do
            echo "::group::Running $f"
            python "$f" || { failed=1; echo "::error::$f FAILED"; }
            echo "::endgroup::"
          done
          if [ "$failed" -ne 0 ]; then echo "::error::Some tests failed"; exit 1; fi
