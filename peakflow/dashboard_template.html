:root[data-theme="light"] {

}

:root[data-theme="dark"] {

}

* {

}

html > body {

a {

h1,

h3,
h4,
h5,
h6,
p {

}

  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {

  padding: 1px 6px;
  border-radius: var(--radius-sm);

}

.table-responsive {

  overflow-x: auto;

}

.table {

  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {

  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive > .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {

}

.table.table-sm :is(th, td) {

}

.table.table-sm :is(th, td):not(:last-child) {

}

.table :is(.text-end, [align="right"]) {

}

.table :is(.text-center, [align="center"]) {

}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget > :not(.card) {

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls > .form-label {
  display: grid;
  min-width: min(100%, 260px);

  gap: 2px 12px;
  margin-bottom: 0;
}

  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,

.btn {

  align-items: center;

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);

  opacity: 0.4;
}

[data-lucide] {

}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:

.form-check {

.form-check-input {

  border: 1px solid var(--input);

  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: "";
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed="true"],
    [aria-selected="true"],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed="true"], [aria-selected="true"], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget > svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html>body{padding:0}</style>
</head>
<body>
<div id="fd-root">
<style>
  #fd-root { font-family: var(--font-sans, ui-sans-serif, system-ui, sans-serif); color: var(--foreground); }
  #fd-root .fd-title { font-size: 16px; font-weight: 600; margin: 0 0 2px; }
  #fd-root .fd-sub { font-size: 12px; color: var(--text-muted, #666); margin: 0 0 10px; }
  #fd-root .fd-panel { margin: 0 0 18px; }
  #fd-root .fd-panel-title { font-size: 13px; font-weight: 600; margin: 0 0 4px; }
  #fd-root .fd-legend { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-bottom: 4px; }
  #fd-root .fd-legend button { display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
    color: var(--foreground); background: transparent; border: 0; padding: 2px 2px; cursor: pointer;
    opacity: .75; }
  #fd-root .fd-legend button[aria-pressed="true"] { opacity: 1; }
  #fd-root .fd-swatch { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }
  #fd-root svg { display: block; }
  #fd-root .fd-axistext { fill: var(--foreground); font-size: 11px; }
  #fd-root .fd-guideline { stroke: var(--foreground); stroke-opacity: .35; stroke-width: 1; pointer-events: none; }
  #fd-root .fd-today { stroke: var(--foreground); stroke-opacity: .5; stroke-dasharray: 4 3; }
  #fd-root .fd-markerc { pointer-events: none; }
  #fd-root .fd-tooltip { position: absolute; pointer-events: none; background: var(--popover, #fff);
    color: var(--popover-foreground, #111); border: 1px solid var(--border, #ccc); border-radius: 6px;
    padding: 6px 9px; font-size: 12px; line-height: 1.5; z-index: 20; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  #fd-root .fd-tooltip .tt-title { font-weight: 600; margin-bottom: 2px; }
  #fd-root .fd-tooltip .tt-row { display: flex; align-items: center; gap: 6px; }
  #fd-root .fd-tooltip .tt-swatch { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  #fd-root .fd-tooltip .tt-val { margin-left: auto; padding-left: 12px; font-variant-numeric: tabular-nums; }
  @media (max-width: 420px) { #fd-root .fd-legend button { font-size: 11px; } }
</style>
<p class="fd-title">客服咨询量预测 · 过程与结果</p>
<p class="fd-sub" id="fd-sub"></p>

<div class="fd-panel">
  <div class="fd-panel-title">预测结果 · 每日转人工（历史实际 + 未来30天三档）</div>
  <div id="fd-transfer"></div>
</div>
<div class="fd-panel">
  <div class="fd-panel-title">预测结果 · 每日进线（历史实际 + 未来30天三档）</div>
  <div id="fd-result"></div>
</div>
<div class="fd-panel">
  <div class="fd-panel-title">预测过程 · Part 1 客户量外推（两渠道共用，按客户类型）</div>
  <div id="fd-cv"></div>
</div>
<div class="fd-panel">
  <div class="fd-panel-title">预测过程 · Part 2 咨询占比外推（在线 / 热线，按客户类型）</div>
  <div id="fd-ratio"></div>
</div>
<div class="fd-tooltip" role="tooltip" style="display:none"></div>
</div>
<script>
(function () {
  var FD = __FD_PAYLOAD__;
  var root = document.getElementById('fd-root');
  var SVG_NS = 'http://www.w3.org/2000/svg';
  var tooltip = root.querySelector('.fd-tooltip');
  var sub = document.getElementById('fd-sub');
  sub.textContent = '数据截至 ' + FD.meta.data_until + '（' + FD.meta.history_days + ' 天历史），未来 ' + FD.meta.horizon + ' 天预测：深色区间 = 悲观~乐观，实线 = 中性。渠道在线/热线分开显示，过程分 Part 1（客户量）与 Part 2（咨询占比）两段。';

  function css(v, fb) { var s = getComputedStyle(document.documentElement).getPropertyValue(v).trim(); return s || fb; }
  var C = {
    fg: css('--foreground', '#1c1c1c'),
    border: css('--border', '#c9c9c9'),
    grid: css('--border', '#e4e4e4'),
    muted: css('--text-muted', '#6b7280'),
    pop: css('--popover', '#ffffff'),
    popFg: css('--popover-foreground', '#111111'),
    series: [1, 2, 3, 4, 5, 6].map(function (i) { return css('--viz-series-' + i, '#1f77b4'); })
  };
  C.band = C.series[1];

  function fmtInt(v) { return Math.round(v).toLocaleString('en-US'); }
  function fmtPct(v) { return (v * 100).toFixed(2) + '%'; }

  // ---------- panel renderer ----------
  function renderPanel(cfg) {
    var host = document.getElementById(cfg.el);
    var wrap = document.createElement('div');
    wrap.className = 'fd-panel';
    host.appendChild(wrap);
    if (cfg.title) {
      var panelTitle = document.createElement('div');
      panelTitle.className = 'fd-panel-title';
      panelTitle.textContent = cfg.title;
      wrap.appendChild(panelTitle);
    }

    // legend
    var leg = document.createElement('div');
    leg.className = 'fd-legend';
    var vis = {};
    cfg.series.forEach(function (s) {
      vis[s.key] = true;
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-pressed', 'true');
      var sw = document.createElement('span');
      sw.className = 'fd-swatch';
      sw.style.background = s.color;
      b.appendChild(sw);
      b.appendChild(document.createTextNode(s.name));
      b.addEventListener('click', function () {
        vis[s.key] = !vis[s.key];
        b.setAttribute('aria-pressed', String(vis[s.key]));
        draw();
      });
      leg.appendChild(b);
    });
    wrap.appendChild(leg);

    var svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', cfg.aria);
    wrap.appendChild(svg);

    var width = 600, height = cfg.height;
    var margin = { t: 10, r: 14, b: cfg.xLabel ? 34 : 22, l: cfg.yLabelWidth || 64 };
    var n = cfg.dates.length;

    function xscale(plotW) { return function (i) { return margin.l + (n <= 1 ? plotW / 2 : i * plotW / (n - 1)); }; }

    function draw() {
      width = Math.max(320, wrap.getBoundingClientRect().width || 600);
      var plotW = width - margin.l - margin.r;
      var plotH = height - margin.t - margin.b;
      svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
      svg.style.width = width + 'px';
      svg.style.height = height + 'px';
      svg.textContent = '';

      // y domain
      var vals = [];
      cfg.series.forEach(function (s) { s.values.forEach(function (v) { if (v != null) vals.push(v); }); });
      if (cfg.band) { cfg.band.low.forEach(function (v) { if (v != null) vals.push(v); });
                      cfg.band.high.forEach(function (v) { if (v != null) vals.push(v); }); }
      if (cfg.yDomain) { vals = cfg.yDomain.slice(); }
      var lo = Math.min.apply(null, vals) || 0, hi = Math.max.apply(null, vals) || 1;
      if (cfg.zeroBase) lo = 0;
      var pad = (hi - lo) * 0.06 || hi * 0.05 || 1;
      var ymin = cfg.zeroBase ? 0 : lo - pad, ymax = hi + pad;
      var y = function (v) { return margin.t + plotH * (1 - (v - ymin) / (ymax - ymin)); };

      // frame
      var frame = document.createElementNS(SVG_NS, 'rect');
      frame.setAttribute('data-chart-frame', '');
      frame.setAttribute('x', margin.l); frame.setAttribute('y', margin.t);
      frame.setAttribute('width', plotW); frame.setAttribute('height', plotH);
      frame.setAttribute('fill', 'none'); frame.setAttribute('stroke', C.border);
      svg.appendChild(frame);

      // horizontal gridlines + y ticks
      var yTicks = 4;
      for (var k = 0; k <= yTicks; k++) {
        var v = ymin + (ymax - ymin) * k / yTicks;
        var yy = y(v);
        var gl = document.createElementNS(SVG_NS, 'line');
        gl.setAttribute('x1', margin.l); gl.setAttribute('x2', margin.l + plotW);
        gl.setAttribute('y1', yy); gl.setAttribute('y2', yy);
        gl.setAttribute('stroke', C.grid); gl.setAttribute('stroke-width', 1);
        svg.appendChild(gl);
        var txt = document.createElementNS(SVG_NS, 'text');
        txt.setAttribute('x', margin.l - 6); txt.setAttribute('y', yy + 4);
        txt.setAttribute('text-anchor', 'end'); txt.setAttribute('class', 'fd-axistext');
        txt.textContent = cfg.yFormat(v);
        svg.appendChild(txt);
      }
      // x ticks
      var xticks = width < 440 ? Math.min(4, n) : Math.min(6, n);
      var step = Math.max(1, Math.floor((n - 1) / (xticks - 1)));
      for (var xi = 0; xi < n; xi += step) {
        var xa = xscale(plotW)(xi);
        var tick = document.createElementNS(SVG_NS, 'line');
        tick.setAttribute('x1', xa); tick.setAttribute('x2', xa);
        tick.setAttribute('y1', margin.t + plotH); tick.setAttribute('y2', margin.t + plotH + 4);
        tick.setAttribute('stroke', C.border);
        svg.appendChild(tick);
        var xl = document.createElementNS(SVG_NS, 'text');
        xl.setAttribute('x', xa); xl.setAttribute('y', margin.t + plotH + 16);
        xl.setAttribute('text-anchor', 'middle'); xl.setAttribute('class', 'fd-axistext');
        xl.textContent = cfg.dates[xi].slice(5);
        svg.appendChild(xl);
      }
      // axis titles
      if (cfg.yLabel) {
        var yt = document.createElementNS(SVG_NS, 'text');
        yt.setAttribute('data-axis', 'y');
        yt.setAttribute('transform', 'rotate(-90 ' + 14 + ' ' + (margin.t + plotH / 2) + ')');
        yt.setAttribute('x', 14); yt.setAttribute('y', margin.t + plotH / 2);
        yt.setAttribute('text-anchor', 'middle'); yt.setAttribute('class', 'fd-axistext');
        yt.textContent = cfg.yLabel;
        svg.appendChild(yt);
      }
      if (cfg.xLabel) {
        var xt = document.createElementNS(SVG_NS, 'text');
        xt.setAttribute('data-axis', 'x');
        xt.setAttribute('x', margin.l + plotW / 2); xt.setAttribute('y', height - 6);
        xt.setAttribute('text-anchor', 'middle'); xt.setAttribute('class', 'fd-axistext');
        xt.textContent = cfg.xLabel;
        svg.appendChild(xt);
      }

      // today marker
      if (cfg.today) {
        var ti = cfg.dates.indexOf(cfg.today);
        if (ti >= 0) {
          var tx = xscale(plotW)(ti);
          var tl = document.createElementNS(SVG_NS, 'line');
          tl.setAttribute('class', 'fd-today');
          tl.setAttribute('x1', tx); tl.setAttribute('x2', tx);
          tl.setAttribute('y1', margin.t); tl.setAttribute('y2', margin.t + plotH);
          svg.appendChild(tl);
          var lab = document.createElementNS(SVG_NS, 'text');
          lab.setAttribute('x', tx + 4); lab.setAttribute('y', margin.t + 12);
          lab.setAttribute('class', 'fd-axistext');
          lab.textContent = '今天';
          svg.appendChild(lab);
        }
      }

      // band
      if (cfg.band) {
        var pts = [], vi = 0;
        for (; vi < n; vi++) {
          var loV = cfg.band.low[vi], hiV = cfg.band.high[vi];
          if (loV == null || hiV == null) continue;
          pts.push((xscale(plotW)(vi)) + ',' + y(loV));
        }
        for (vi = n - 1; vi >= 0; vi--) {
          var loV2 = cfg.band.low[vi], hiV2 = cfg.band.high[vi];
          if (loV2 == null || hiV2 == null) continue;
          pts.push((xscale(plotW)(vi)) + ',' + y(hiV2));
        }
        if (pts.length) {
          var area = document.createElementNS(SVG_NS, 'polygon');
          area.setAttribute('points', pts.join(' '));
          area.setAttribute('fill', cfg.band.color);
          area.setAttribute('fill-opacity', '0.16');
          area.setAttribute('stroke', 'none');
          svg.appendChild(area);
        }
      }

      // series lines
      cfg.series.forEach(function (s) {
        if (!vis[s.key]) return;
        var d = '';
        for (var i = 0; i < n; i++) {
          var v = s.values[i];
          if (v == null) { d += ' L '; continue; }
          var X = xscale(plotW)(i), Y = y(v);
          d += (d === '' || d.slice(-2) === 'L ' ? 'M ' : 'L ') + X.toFixed(1) + ' ' + Y.toFixed(1) + ' ';
        }
        if (!d) return;
        var path = document.createElementNS(SVG_NS, 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', s.color);
        path.setAttribute('stroke-width', s.key === 'mid' ? 2.2 : 1.8);
        path.setAttribute('stroke-linejoin', 'round');
        svg.appendChild(path);
      });

      // hover overlay
      var ov = document.createElementNS(SVG_NS, 'rect');
      ov.setAttribute('data-chart-hit', '');
      ov.setAttribute('x', margin.l); ov.setAttribute('y', margin.t);
      ov.setAttribute('width', plotW); ov.setAttribute('height', plotH);
      ov.setAttribute('fill', 'transparent');
      ov.style.cursor = 'crosshair';
      svg.appendChild(ov);

      var guide = null, markers = [];
      function move(evt) {
        var rect = svg.getBoundingClientRect();
        var mx = evt.clientX - rect.left - margin.l;
        var my = evt.clientY - rect.top - margin.t;
        if (mx < 0 || mx > plotW || my < 0 || my > plotH) { hide(); return; }
        var f = mx / plotW * (n - 1);
        var i0 = Math.max(0, Math.min(n - 2, Math.floor(f)));
        var frac = f - i0;
        var gx = margin.l + mx;
        if (!guide) {
          guide = document.createElementNS(SVG_NS, 'line');
          guide.setAttribute('class', 'fd-guideline');
          svg.appendChild(guide);
        }
        guide.setAttribute('x1', gx); guide.setAttribute('x2', gx);
        guide.setAttribute('y1', margin.t); guide.setAttribute('y2', margin.t + plotH);

        markers.forEach(function (m) { svg.removeChild(m); });
        markers = [];
        var rows = '<div class="tt-title">' + cfg.dates[Math.round(f)] + '</div>';
        var shown = 0;
        cfg.series.forEach(function (s) {
          if (!vis[s.key]) return;
          var a = s.values[i0], b = s.values[i0 + 1];
          if (a == null && b == null) return;
          var vv = (a == null ? b : (b == null ? a : a + (b - a) * frac));
          var yy = y(vv);
          var mk = document.createElementNS(SVG_NS, 'circle');
          mk.setAttribute('class', 'fd-markerc');
          mk.setAttribute('cx', gx); mk.setAttribute('cy', yy); mk.setAttribute('r', 3.2);
          mk.setAttribute('fill', s.color); mk.setAttribute('stroke', C.pop); mk.setAttribute('stroke-width', 1.2);
          svg.appendChild(mk); markers.push(mk);
          rows += '<div class="tt-row"><span class="tt-swatch" style="background:' + s.color + '"></span>' +
                  '<span>' + s.name + '</span><span class="tt-val">' + cfg.yFormat(vv) + '</span></div>';
          shown++;
        });
        tooltip.innerHTML = rows || '<div class="tt-title">' + cfg.dates[Math.round(f)] + '</div>';
        tooltip.style.display = 'block';
        var rx = evt.clientX - root.getBoundingClientRect().left;
        var ry = evt.clientY - root.getBoundingClientRect().top;
        var tw = tooltip.offsetWidth;
        tooltip.style.left = (rx + 12 + tw > root.clientWidth ? rx - tw - 12 : rx + 12) + 'px';
        tooltip.style.top = (ry + 14) + 'px';
      }
      function hide() { tooltip.style.display = 'none'; if (guide) guide.setAttribute('opacity', '0'); }
      ov.addEventListener('mousemove', move);
      ov.addEventListener('mouseleave', hide);
    }

    new ResizeObserver(function () {
      if (wrap.getBoundingClientRect().width > 0) draw();
    }).observe(wrap);
    draw();
  }

  // ---------- build panels ----------
  function buildResult() {
    var dom = [0, 0], types = [];
    ['在线', '热线'].forEach(function (chKey) {
      var ch = FD.channels[chKey];
      var hist = ch.history.slice(-60);
      var histDates = hist.map(function (h) { return h.d; });
      var fcDates = ch.forecast.map(function (f) { return f.d; });
      var dates = histDates.concat(fcDates);
      var hBy = {}; hist.forEach(function (h) { hBy[h.d] = h; });
      var fBy = {}; ch.forecast.forEach(function (f) { fBy[f.d] = f; });
      var actual = dates.map(function (d) { return hBy[d] ? hBy[d].in : null; });
      var low = dates.map(function (d) { return fBy[d] ? fBy[d].low : null; });
      var mid = dates.map(function (d) { return fBy[d] ? fBy[d].mid : null; });
      var high = dates.map(function (d) { return fBy[d] ? fBy[d].high : null; });
      dom.push({ chKey: chKey, dates: dates, actual: actual, low: low, mid: mid, high: high });
      ['low', 'mid', 'high'].forEach(function (k) { dom[k] = dom[k] || []; });
      types.push({ chKey: chKey, dates: dates, actual: actual, low: low, mid: mid, high: high });
    });
    // shared y domain across both channels
    var all = [];
    types.forEach(function (t) { all = all.concat(t.actual.filter(Boolean), t.low.filter(Boolean), t.mid.filter(Boolean), t.high.filter(Boolean)); });
    var hi = Math.max.apply(null, all);
    var yDom = [0, Math.ceil(hi * 1.06 / 1000) * 1000];
    types.forEach(function (t) {
      renderPanel({
        el: 'fd-result', aria: t.chKey + '渠道：历史实际与未来30天三档进线预测',
        title: t.chKey,
        dates: t.dates, today: FD.meta.data_until, yDomain: yDom, zeroBase: true,
        yLabel: t.chKey + ' · 每日进线（次）', xLabel: '日期', height: 250, yFormat: fmtInt,
        band: { low: t.low, high: t.high, color: C.band },
        series: [
          { key: 'actual', name: '历史实际', color: C.series[0], values: t.actual },
          { key: 'mid', name: '预测·中性', color: C.series[1], values: t.mid }
        ]
      });
    });
  }

  function buildProcess() {
    var ch = FD.channels['在线'];
    var dates = ch.forecast.map(function (f) { return f.d; });
    function seriesFrom(list) {
      var by = {}; list.forEach(function (r) { (by[r.t] = by[r.t] || [])[dates.indexOf(r.d)] = r.v; });
      return FD.meta.types.map(function (t, i) {
        var vals = dates.map(function (_, j) { return by[t] ? (by[t][j] != null ? by[t][j] : null) : null; });
        return { key: t, name: t, color: C.series[i % 6], values: vals };
      });
    }
    // Part 1: client volume (channel-independent)
    renderPanel({ el: 'fd-cv', aria: 'Part 1 各类客户量未来30天外推',
      title: '在线 / 热线共用客户池',
      dates: dates, yLabel: '客户量（人）', xLabel: '未来日期', height: 250, yFormat: fmtInt,
      series: seriesFrom(ch.client_vol) });
    // Part 2: ratio per channel
    ['在线', '热线'].forEach(function (chKey, gi) {
      var s = seriesFrom(FD.channels[chKey].ratio_fc);
      renderPanel({ el: 'fd-ratio', aria: 'Part 2 ' + chKey + '渠道各类咨询占比未来30天外推',
        title: chKey,
        dates: dates, yLabel: chKey + ' · 咨询占比', xLabel: '未来日期', height: 250, yFormat: fmtPct,
        series: s });
    });
  }

  function buildTransfer() {
    var types = [];
    ['在线', '热线'].forEach(function (chKey) {
      var ch = FD.channels[chKey];
      var hist = ch.history.slice(-60);
      var histDates = hist.map(function (h) { return h.d; });
      var fcDates = ch.transfer.map(function (f) { return f.d; });
      var dates = histDates.concat(fcDates);
      var hBy = {}; hist.forEach(function (h) { hBy[h.d] = h; });
      var fBy = {}; ch.transfer.forEach(function (f) { fBy[f.d] = f; });
      var actual = dates.map(function (d) { return hBy[d] ? hBy[d].tr : null; });
      var low = dates.map(function (d) { return fBy[d] ? fBy[d].low : null; });
      var mid = dates.map(function (d) { return fBy[d] ? fBy[d].mid : null; });
      var high = dates.map(function (d) { return fBy[d] ? fBy[d].high : null; });
      types.push({ chKey: chKey, dates: dates, actual: actual, low: low, mid: mid, high: high });
    });
    var all = [];
    types.forEach(function (t) { all = all.concat(t.actual.filter(Boolean), t.low.filter(Boolean), t.mid.filter(Boolean), t.high.filter(Boolean)); });
    var hi = Math.max.apply(null, all);
    var yDom = [0, Math.ceil(hi * 1.06 / 1000) * 1000];
    types.forEach(function (t) {
      renderPanel({
        el: 'fd-transfer', aria: t.chKey + '渠道：未来30天三档转人工预测',
        title: t.chKey,
        dates: t.dates, today: FD.meta.data_until, yDomain: yDom, zeroBase: true,
        yLabel: t.chKey + ' · 每日转人工（次）', xLabel: '日期', height: 250, yFormat: fmtInt,
        band: { low: t.low, high: t.high, color: C.band },
        series: [
          { key: 'actual', name: '历史实际', color: C.series[0], values: t.actual },
          { key: 'mid', name: '预测·中性', color: C.series[1], values: t.mid }
        ]
      });
    });
  }

  buildTransfer();
  buildResult();
  buildProcess();
})();
</script>

<script src="https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js"></script>
<script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"></script>
<script>
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =>
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest("[data-tooltip]")
      : null;
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () => {
    closeTooltip(false);
    document.removeEventListener("pointerover", handlePointerOpen);
    document.removeEventListener("pointerout", handleLeave);
    document.removeEventListener("focusin", handleFocusIn);
    document.removeEventListener("focusout", handleLeave);
    document.removeEventListener("keydown", handleKeyDown);
    document.removeEventListener("contextmenu", handleContextMenu);
    tooltip = null;
  };

  document.addEventListener("pointerover", handlePointerOpen);
  document.addEventListener("pointerout", handleLeave);
  document.addEventListener("focusin", handleFocusIn);
  document.addEventListener("focusout", handleLeave);
  document.addEventListener("keydown", handleKeyDown);
  document.addEventListener("contextmenu", handleContextMenu);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-lucide" async src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js"></script>

(() => {

    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });

  if (globalThis.lucide != null) {
