<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoShift 自动排班工具</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    background: #f0f2f5; color: #1a1a2e; min-height: 100vh;
  }
  .container { max-width: 880px; margin: 0 auto; padding: 32px 20px; }

  /* header */
  .header { margin-bottom: 28px; display: flex; justify-content: space-between; align-items: flex-start; }
  .header-left { }
  .header h1 { font-size: 26px; font-weight: 700; letter-spacing: 0.5px; }
  .header p { color: #666; margin-top: 4px; font-size: 14px; }

  /* cards */
  .card {
    background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
    padding: 24px; margin-bottom: 20px;
  }
  .card-title {
    font-size: 15px; font-weight: 600; margin-bottom: 16px;
    padding-bottom: 10px; border-bottom: 1px solid #eee;
  }

  /* form grid */
  .form-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px;
  }
  .form-group { display: flex; flex-direction: column; }
  .form-group.full-width { grid-column: 1 / -1; }
  .form-group label {
    font-size: 13px; font-weight: 500; color: #444; margin-bottom: 4px;
  }
  .form-group input[type="number"],
  .form-group input[type="text"] {
    padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 6px;
    font-size: 14px; transition: border .2s; outline: none;
  }
  .form-group input:focus { border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,.15); }

  /* file upload */
  .file-upload {
    position: relative; border: 2px dashed #d9d9d9; border-radius: 8px;
    padding: 20px; text-align: center; cursor: pointer; transition: border .2s;
    background: #fafafa;
  }
  .file-upload:hover { border-color: #1a73e8; background: #f0f6ff; }
  .file-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .file-upload .icon { font-size: 28px; display: block; margin-bottom: 6px; }
  .file-upload .text { font-size: 14px; color: #666; }
  .file-upload .text strong { color: #1a73e8; }
  .file-upload .hint { font-size: 12px; color: #999; margin-top: 4px; }
  .file-selected { border-color: #52c41a; background: #f6ffed; }
  .file-selected .text { color: #333; }
  .file-selected .filename { font-weight: 600; color: #1a73e8; }

  /* buttons */
  .btn-row { display: flex; gap: 12px; align-items: center; margin-top: 8px; }
  .btn {
    padding: 10px 28px; border: none; border-radius: 8px; font-size: 15px;
    font-weight: 600; cursor: pointer; transition: all .2s; display: inline-flex;
    align-items: center; gap: 6px;
  }
  .btn-primary { background: #1a73e8; color: #fff; }
  .btn-primary:hover { background: #1557b0; }
  .btn-primary:disabled { background: #a0c4ff; cursor: not-allowed; }
  .btn-success { background: #52c41a; color: #fff; }
  .btn-success:hover { background: #389e0d; }
  .btn-success:disabled { background: #b7eb8f; cursor: not-allowed; }
  .btn-exit { background: #fff; color: #888; border: 1px solid #ddd; padding: 6px 16px; font-size: 13px; }
  .btn-exit:hover { background: #fff1f0; color: #f5222d; border-color: #ffa39e; }
  .btn-download { background: #fff; color: #1a73e8; border: 1px solid #1a73e8; font-size: 13px; padding: 7px 18px; text-decoration: none; }
  .btn-download:hover { background: #f0f6ff; border-color: #1557b0; color: #1557b0; }

  /* loading */
  .spinner { display: none; width: 18px; height: 18px; border: 2px solid #fff;
    border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn-loading .spinner { display: inline-block; }
  .btn-loading .label { display: none; }

  /* result */
  .result-section { display: none; }
  .result-section.visible { display: block; }

  .summary-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
  }
  .summary-item {
    background: #fafafa; border-radius: 8px; padding: 14px; text-align: center;
  }
  .summary-item .num {
    font-size: 26px; font-weight: 700; line-height: 1.2;
  }
  .summary-item .num.green { color: #52c41a; }
  .summary-item .num.red { color: #f5222d; }
  .summary-item .num.orange { color: #fa8c16; }
  .summary-item .num.blue { color: #1a73e8; }
  .summary-item .lbl { font-size: 12px; color: #888; margin-top: 2px; }

  .warning-count {
    font-size: 13px; color: #666; margin-top: 16px; display: flex; gap: 16px;
  }
  .warning-count .badge {
    display: inline-block; padding: 2px 10px; border-radius: 10px;
    font-size: 12px; font-weight: 600;
  }
  .badge-error { background: #fff1f0; color: #cf1322; }
  .badge-warn { background: #fffbe6; color: #d48806; }
  .badge-info { background: #e6f7ff; color: #096dd9; }

  .warn-table {
    width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px;
  }
  .warn-table th {
    text-align: left; padding: 8px 10px; background: #fafafa; font-weight: 600;
    border-bottom: 2px solid #eee; color: #555;
  }
  .warn-table td {
    padding: 7px 10px; border-bottom: 1px solid #f0f0f0;
  }
  .warn-table tr:hover td { background: #fafafa; }
  .warn-table .sev-error { border-left: 3px solid #f5222d; }
  .warn-table .sev-warn { border-left: 3px solid #fa8c16; }
  .warn-table .sev-info { border-left: 3px solid #1a73e8; }
  .warn-table .sev-tag {
    display: inline-block; padding: 1px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 600;
  }
  .sev-tag-error { background: #fff1f0; color: #cf1322; }
  .sev-tag-warn { background: #fffbe6; color: #d48806; }
  .sev-tag-info { background: #e6f7ff; color: #096dd9; }

  .error-box {
    background: #fff2f0; border: 1px solid #ffccc7; border-radius: 8px;
    padding: 14px 18px; color: #cf1322; font-size: 14px; margin-bottom: 16px;
  }

  .reminder-done {
    margin-top: 16px; padding: 10px 14px; border-radius: 8px;
    background: #f6ffed; border: 1px solid #b7eb8f; color: #389e0d; font-size: 14px;
  }
  .warn-groups { margin-top: 16px; }
  .warn-groups-title { font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px; }
  .warn-groups .group-item {
    display: inline-flex; align-items: center; gap: 8px; background: #fafafa;
    border-radius: 6px; padding: 6px 12px; margin: 4px 8px 0 0; font-size: 13px;
  }
  .warn-groups .group-item .count { font-weight: 700; color: #d48806; }
  .info-line { margin-top: 12px; font-size: 13px; color: #096dd9; }

  @media (max-width: 640px) {
    .form-grid { grid-template-columns: 1fr; }
    .summary-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="container">

<div class="header">
  <div class="header-left">
    <h1>📋 AutoShift 自动排班</h1>
    <p>上传排班计划 Excel，调整参数，自动生成排班结果</p>
  </div>
  <button class="btn btn-exit" id="exitBtn">✕ 退出</button>
</div>

<!-- ====== 参数区 ====== -->
<div class="card">
  <div class="card-title">📂 排班计划</div>
  <div class="form-group full-width" style="margin-bottom:16px">
    <div class="file-upload" id="fileDrop">
      <input type="file" accept=".xlsx" id="fileInput">
      <span class="icon">📄</span>
      <div class="text">拖拽或 <strong>点击选择</strong> Excel 文件</div>
      <div class="hint">仅支持 .xlsx 格式</div>
    </div>
  </div>
  <div style="margin-bottom:16px">
    <a class="btn btn-download" id="templateBtn" href="/template">⬇️ 下载排班计划模板</a>
  </div>

  <div class="card-title" style="margin-bottom:12px">⚙️ 排班参数</div>
  <div class="form-grid">
    <div class="form-group">
      <label>预设休息天数</label>
      <input type="number" name="preset_rest_days" value="8" min="1" max="31">
    </div>
    <div class="form-group">
      <label>最大连续上班（普通）</label>
      <input type="number" name="max_consecutive_work_normal" value="6" min="1" max="31">
    </div>
    <div class="form-group">
      <label>最大连续上班（三期）</label>
      <input type="number" name="max_consecutive_work_phase3" value="5" min="1" max="31">
    </div>
    <div class="form-group">
      <label>最大连续休息</label>
      <input type="number" name="max_consecutive_rest" value="2" min="1" max="14">
    </div>
    <div class="form-group">
      <label>休息间隔最小工作日</label>
      <input type="number" name="min_work_days_between_rest_blocks" value="3" min="0" max="14">
    </div>
    <div class="form-group">
      <label>最大连续高强度 (D/D1/Z/Z1)</label>
      <input type="number" name="max_high_consecutive" value="2" min="1" max="14">
    </div>
    <div class="form-group">
      <label>均衡阈值</label>
      <input type="number" name="balance_threshold" value="2" min="0" max="20">
    </div>
    <div class="form-group">
      <label>输出文件名</label>
      <input type="text" name="output_name" value="排班结果.xlsx">
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="runBtn" disabled>
      <span class="spinner"></span>
      <span class="label">🚀 开始排班</span>
    </button>
    <span id="statusText" style="font-size:13px;color:#999;"></span>
  </div>
</div>

<!-- ====== 结果区 ====== -->
<div class="result-section card" id="resultSection">
  <div class="card-title">📊 排班结果</div>

  <div id="errorBox" class="error-box" style="display:none"></div>

  <div class="summary-grid" id="summaryGrid"></div>

  <div style="margin-top:16px">
    <button class="btn btn-success" id="downloadBtn" style="display:none">
      ⬇️ 下载结果文件
    </button>
  </div>

  <div id="reminderDone" class="reminder-done" style="display:none">✅ 班表已排满，无提醒</div>

  <div class="warning-count" id="warningCount" style="display:none"></div>

  <div class="warn-groups" id="warnGroups" style="display:none"></div>

  <div class="info-line" id="infoLine" style="display:none"></div>

  <div style="overflow-x:auto">
    <table class="warn-table" id="warnTable">
      <thead><tr>
        <th style="width:50px">级别</th>
        <th style="width:64px">编号</th>
        <th style="width:80px">员工</th>
        <th style="width:100px">日期</th>
        <th>描述</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

</div>

<script>
const fileInput = document.getElementById('fileInput');
const fileDrop = document.getElementById('fileDrop');
const runBtn = document.getElementById('runBtn');
const statusText = document.getElementById('statusText');
const resultSection = document.getElementById('resultSection');
const errorBox = document.getElementById('errorBox');
const summaryGrid = document.getElementById('summaryGrid');
const downloadBtn = document.getElementById('downloadBtn');
const warningCount = document.getElementById('warningCount');
const reminderDone = document.getElementById('reminderDone');
const warnGroups = document.getElementById('warnGroups');
const infoLine = document.getElementById('infoLine');
const warnTbody = document.querySelector('#warnTable tbody');
const warnTableWrap = document.querySelector('#warnTable').parentElement;

let downloadToken = null;
let downloadName = '';

// --- file selection ---
fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (f) {
    fileDrop.classList.add('file-selected');
    fileDrop.querySelector('.text').innerHTML =
      `<span class="filename">${f.name}</span> (${(f.size / 1024).toFixed(1)} KB)`;
    fileDrop.querySelector('.hint').textContent = '点击更换文件';
    fileDrop.querySelector('.icon').textContent = '✅';
    runBtn.disabled = false;
  } else {
    fileDrop.classList.remove('file-selected');
    fileDrop.querySelector('.text').innerHTML = '拖拽或 <strong>点击选择</strong> Excel 文件';
    fileDrop.querySelector('.hint').textContent = '仅支持 .xlsx 格式';
    fileDrop.querySelector('.icon').textContent = '📄';
    runBtn.disabled = true;
  }
});

// --- run ---
runBtn.addEventListener('click', async () => {
  const file = fileInput.files[0];
  if (!file) return;

  runBtn.disabled = true;
  runBtn.classList.add('btn-loading');
  statusText.textContent = '正在排班，请稍候...';
  resultSection.classList.remove('visible');
  errorBox.style.display = 'none';

  const formData = new FormData();
  formData.append('file', file);
  for (const input of document.querySelectorAll('.form-grid input')) {
    formData.append(input.name, input.value);
  }

  try {
    const res = await fetch('/run', { method: 'POST', body: formData });
    const data = await res.json();

    if (data.error) {
      showError(data.error);
      return;
    }

    downloadToken = data.token;
    downloadName = data.download_name;
    showResults(data);
  } catch (e) {
    showError('网络错误，请检查服务是否正常运行');
  } finally {
    runBtn.disabled = false;
    runBtn.classList.remove('btn-loading');
    statusText.textContent = '';
  }
});

// --- download ---
downloadBtn.addEventListener('click', () => {
  if (!downloadToken) return;
  const a = document.createElement('a');
  a.href = '/download/' + downloadToken;
  a.download = downloadName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  // one-time download
  downloadToken = null;
  downloadBtn.disabled = true;
  downloadBtn.textContent = '✅ 已下载';
});

// --- exit ---
document.getElementById('exitBtn').addEventListener('click', async () => {
  if (!confirm('确定要退出 AutoShift 吗？')) return;
  try {
    await fetch('/shutdown', { method: 'POST' });
  } catch (e) {
    // server will close immediately, fetch may fail
  }
});

// --- helpers ---
function showError(msg) {
  errorBox.textContent = '❌ ' + msg;
  errorBox.style.display = 'block';
  resultSection.classList.add('visible');
}

function severityClass(sev) {
  if (sev === 'ERROR') return 'sev-error';
  if (sev === 'WARN') return 'sev-warn';
  return 'sev-info';
}

function severityTag(sev) {
  if (sev === 'ERROR') return 'sev-tag-error';
  if (sev === 'WARN') return 'sev-tag-warn';
  return 'sev-tag-info';
}

function showResults(data) {
  resultSection.classList.add('visible');
  downloadBtn.style.display = 'inline-flex';
  downloadBtn.disabled = false;
  downloadBtn.textContent = '⬇️ 下载结果文件';

  // summary
  const s = data.summary;
  summaryGrid.innerHTML = `
    <div class="summary-item">
      <div class="num blue">${s.employees}</div>
      <div class="lbl">员工数</div>
    </div>
    <div class="summary-item">
      <div class="num blue">${s.dates}</div>
      <div class="lbl">排班天数</div>
    </div>
    <div class="summary-item">
      <div class="num red">${s.error_count}</div>
      <div class="lbl">ERROR</div>
    </div>
    <div class="summary-item">
      <div class="num orange">${s.warn_count}</div>
      <div class="lbl">WARN</div>
    </div>
  `;

  renderReminders(data.reminders);
}

function renderReminders(reminders) {
  // reset
  warningCount.style.display = 'none';
  warnGroups.style.display = 'none';
  infoLine.style.display = 'none';
  warnTbody.innerHTML = '';
  warnTableWrap.style.display = 'none';

  // 无空白：整体不做提醒
  if (!reminders) {
    reminderDone.style.display = 'block';
    return;
  }
  reminderDone.style.display = 'none';

  const errCount = reminders.errors.length;
  const warnCount = reminders.warn_groups.reduce((sum, g) => sum + g.count, 0);

  // badges：ERROR / WARN 总数 / INFO 总数
  warningCount.style.display = 'flex';
  warningCount.innerHTML = `
    共 <strong>${errCount + warnCount + reminders.info_count}</strong> 条提醒
    <span class="badge badge-error">${errCount} ERROR</span>
    <span class="badge badge-warn">${warnCount} WARN</span>
    ${reminders.info_count ? `<span class="badge badge-info">${reminders.info_count} INFO</span>` : ''}
  `;

  // ERROR 明细置顶
  if (reminders.errors.length > 0) {
    warnTableWrap.style.display = 'block';
    for (const w of reminders.errors) {
      const tr = document.createElement('tr');
      tr.className = 'sev-error';
      tr.innerHTML = `
        <td><span class="sev-tag sev-tag-error">ERROR</span></td>
        <td>${w.check_id}</td>
        <td>${w.employee || '-'}</td>
        <td>${w.date || '-'}</td>
        <td>${w.message}</td>
      `;
      warnTbody.appendChild(tr);
    }
  }

  // WARN 只报类型 × 数量
  if (reminders.warn_groups.length > 0) {
    warnGroups.style.display = 'block';
    warnGroups.innerHTML =
      '<div class="warn-groups-title">WARN 提醒分类</div>' +
      reminders.warn_groups.map(g =>
        `<span class="group-item">${g.label} <span class="count">× ${g.count}</span></span>`
      ).join('');
  }

  // INFO 提示总数
  if (reminders.info_count > 0) {
    infoLine.style.display = 'block';
    infoLine.textContent = `ℹ️ INFO 提醒共 ${reminders.info_count} 条`;
  }
}
</script>
</body>
</html>
