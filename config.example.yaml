# AutoWFM 配置模板（本文件入库；复制为 config.yaml 后按实际环境填写）
#
# 用法：
#   1. cp config.example.yaml config.yaml
#   2. 按本文件注释填入各业务参数（ws链接 / url / 手机号 / exports 等）
#   3. cp .env.example .env 并填入密钥（token / tenementId / webhook / dash_token）
#   4. config.yaml 与 .env 均被 .gitignore 忽略，不会入库
#
# 本模板已脱敏，以下字段留空，需手动填写：
#   - endpoints.online / other          : WebSocket 连接地址
#   - notify.screenshot_url             : 看板截图 URL
#   - notify.alert.gap_recipient        : 采集缺口告警 @ 人（手机号）
#   - notify.alert.recipients.*         : 各线路告警 @ 人（手机号）
#   - forecast.alert_recipient          : 预测差异告警 @ 人（手机号）
#   - subs[*].data.agentStatusDeptId    : 部门密钥 ID
#   - detail_modes[*].url               : 明细导出 API 地址
#   - detail_modes[*].data.exports      : 导出列名（逗号分隔）
# 密钥字段（secrets.token / secrets.tenementId / notify.webhook.* / notify.dash_token）
# token 失效时会自动运行 抓取Token.py 刷新，写入 token.json 并回填 .env；登录账密在根目录 login.json(不入库)。
# 由 .env 的 AUTOWFM_* 环境变量覆盖（见 collector/_utils.py _SECRET_ENV_MAP）。

endpoints:
  online: ""
  other:  ""
schedule:
  interval_minutes: 5
  window_start: "09:00"
  window_end: "21:04"
  timezone: "Asia/Shanghai"
ws:
  connect_timeout: 12
  recv_timeout: 8
  retry: 1
  retry_backoff_base: 2   # 重试间隔=2^attempt 秒的基础值(0=不等待)
  gap_alert_threshold: 5   # 连续 5 周期(约25分钟)某源无数据/异常 -> 日志告警一次
  backfill_retry_delay: 5  # 单周期内失败源补采前的等待秒数
detail:
  timeout: 60
secrets:
  token: ""              # 主来源 .env(AUTOWFM_TOKEN)；失效自动刷新(抓取Token.py)并同步 token.json
  tenementId: ""         # AUTOWFM_TENEMENT_ID
storage:
  dir: "data"
  backend: "sqlite"   # 存储后端:sqlite(默认) | postgresql(将来);Repository 模式按此切换实现
logging:
  path: "logs/autowfm.log"

notify:
  screenshot_url: ""   # 看板地址，如 http://127.0.0.1:8080/
  push_minutes: [0, 15, 30, 45]
  push_wait_timeout: 30   # push_job 等待 ws/detail 当周期完成的最长秒数,超时退化为上一周期数据
  webhook:
    main_key: ""           # AUTOWFM_WEBHOOK_MAIN（一线 + 截图）
    secondary_key: ""      # AUTOWFM_WEBHOOK_SECONDARY（二线 + 截图）
  dash_token: ""           # 看板 Bearer Token(AUTOWFM_DASH_TOKEN);留空则看板无认证(本地开发)
  alert:
    hotline_queue: 10
    online_queue: 20
    queue_12378: 1
    stall_check: true           # 转人工量与上一周期采集值一致时告警(热线/在线,艾特对应负责人;首次停滞提醒一次)
    gap_recipient: [""]   # 采集缺口告警 @ 人(走 main_key)
    recipients:
      hotline: ["", ""]
      online: ["", ""]
      "12378": ["", "", ""]

forecast:
  diff_threshold: 0.10          # 相对差异阈值(|forecast-csv|/csv)，超过则告警
  alert_recipient: [""]
  holidays_file: "holidays.txt" # 项目根
  output_dir: "output"

seat_data: &seat_data
  skillCode: ""

subs:
  - {name: "热线",      endpoint: other,  screen: STATICS,    data: {skillCode: "", numberType: ""}}
  - {name: "12378",     endpoint: other,  screen: STATICS,    data: {skillCode: "", numberType: ""}, schedule: {weekday: {start: "08:30", end: "21:00"}, weekend: {start: "09:00", end: "18:00"}}}
  - {name: "热线明细",   endpoint: other,  screen: SEAT,       skill: "", data: {<<: *seat_data, skillCode: ""}}
  - {name: "常规",      endpoint: other,  screen: SEAT,       skill: "", data: {<<: *seat_data, skillCode: ""}, im: {endpoint: online, screen: IM_MONITOR, data: {skillCode: "", agentStatus: "", emailList: [], orderField: "", order: "", agentSkillCode: ""}}}
  - {name: "贷后",      endpoint: other,  screen: SEAT,       skill: "", data: {<<: *seat_data, skillCode: ""}, im: {endpoint: online, screen: IM_MONITOR, data: {skillCode: "", agentStatus: "", emailList: [], orderField: "", order: "", agentSkillCode: ""}}}
  - {name: "12378明细",  endpoint: other,  screen: SEAT,       skill: "", data: {<<: *seat_data, skillCode: "", agentStatusDeptId: ""}, schedule: {weekday: {start: "08:30", end: "21:00"}, weekend: {start: "09:00", end: "18:00"}}}
  - {name: "在线",      endpoint: online, screen: IM_MONITOR, data: {skillCode: "", agentStatus: "", emailList: [], orderField: "", order: "", agentSkillCode: ""}}

detail_modes:
  会话记录:
    url: ""
    date_fields: {start: staStartDt, end: endStartDt}
    date_format: "%Y-%m-%d %H:%M:%S"
    filter:
      channel_column: "渠道列名"
      channels: ["渠道甲", "渠道乙"]
      group_column: "组别列名"
      groups: ["甲组", "乙组", "丙组", "丁组", "戊组"]
    data:
      columns: "startDt"
      orders: "DESC"
      fromTypeId: "TEL,ZXKF,QT"
      isDesensitization: true
      exports: ""
  工单明细:
    url: ""
    date_fields: {start: startCrtDt, end: endCrtDt}
    date_format: "%Y-%m-%d"
    filter:
      group_column: "组别列名"
      groups: ["甲组", "乙组", "丙组", "丁组", "戊组", "己组", "庚组", "辛组"]
      row_exclude:
        eq_columns: ["建立坐席", "接收坐席"]   # 两列值相等则排除该行（如排除自建自接工单）；未配置则不过滤
        exclude_groups: ["丙组", "丁组", "戊组", "己组", "庚组", "辛组"]  # 仅对这些组应用排除；未列出（如甲组/乙组）保留全部行；省略则对所有组生效
    data:
      isDesensitization: true
      exports: ""
# ============ 接待上限批量修改(member_limit) ============
# 腾讯云联络中心成员接待上限批量修改工具。
# 凭据(账号/密码)由 .env 的 AUTOWFM_QCLOUD_ACCOUNT / AUTOWFM_QCLOUD_PASSWORD 提供。
member_limit:
  url: "https://desk.qcloud.com/"
  limit: 3              # 手动执行输入框的默认值(实际以 UI 输入框为准)
  headless: true        # 无头运行;排障可临时改 false(可见窗口)
  members: []           # 待调整的成员昵称列表(成员页第一列，需完全一致)
